<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Latent.pk — Cover</title>
<link rel="stylesheet" href="global.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<style>
  .brand-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 18px rgba(0, 230, 118, 0.6);
  }
  .wordmark {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 18px;
    color: var(--primary);
    letter-spacing: -0.01em;
  }
  .meta-line {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 11px;
    color: var(--muted-2);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .hero-wordmark {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 96px;
    color: var(--primary);
    letter-spacing: -0.04em;
    line-height: 0.95;
  }
  .tagline {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 28px;
    color: var(--primary);
    max-width: 820px;
    margin-top: 24px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .sub-tagline {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 17px;
    color: var(--muted);
    max-width: 740px;
    margin-top: 16px;
    line-height: 1.5;
  }
  .accent-bar {
    width: 56px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(0, 230, 118, 0.55);
  }
</style>
</head>
<body>
  <div class="slide">
    <!-- Decorative background layers -->
    <div class="grid-bg" data-decor aria-hidden="true"></div>
    <div class="glow-orb green" data-decor aria-hidden="true"
         style="top:-180px; right:-180px; width:600px; height:600px;"></div>
    <div class="glow-orb blue" data-decor aria-hidden="true"
         style="bottom:-160px; left:-160px; width:420px; height:420px;"></div>

    <!-- Top strip: brand + meta -->
    <div class="flex items-center justify-between" style="position:relative; z-index:1;">
      <div class="flex items-center gap-3">
        <div class="brand-dot" data-decor aria-hidden="true"></div>
        <span class="wordmark">Latent.pk</span>
      </div>
      <span class="meta-line">INVESTOR DECK · 2026</span>
    </div>

    <!-- Vertical center hero block -->
    <div style="position:relative; z-index:1; flex:1; display:flex; flex-direction:column; justify-content:center; padding-left:0;">
      <div>
        <span class="accent-pill">PRE-SEED ROUND</span>
      </div>
      <h1 class="hero-wordmark" style="margin-top:24px;">Latent.pk</h1>
      <p class="tagline">Turning “what stock should I buy” into “here's the plan to reach your goal.”</p>
      <p class="sub-tagline">AI-driven, goal-based investment intelligence for the Pakistan Stock Exchange.</p>
    </div>

    <!-- Accent bar above page-mark -->
    <div style="position:relative; z-index:1; margin-bottom:18px;">
      <div class="accent-bar" data-decor aria-hidden="true"></div>
    </div>

    <!-- Page mark -->
    <div class="page-mark">
      <span class="brand">LATENT.PK</span>
      <span class="num">01 / 14</span>
    </div>
  </div>
</body>
</html>
