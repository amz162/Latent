<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Latent.pk — Let's Build the Interface</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .closing-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .closing-dot {
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(0, 230, 118, 0.6);
  }
  .closing-wordmark {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 18px;
    color: var(--primary);
    letter-spacing: -0.01em;
  }
  .closing-meta {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 11px;
    color: var(--muted-2);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .closing-contact-dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .closing-accent-bar {
    position: absolute;
    bottom: 64px;
    left: 72px;
    width: 56px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(0, 230, 118, 0.55);
    z-index: 2;
  }
</style>
</head>
<body>
<div class="slide" style="padding:0;">
  <!-- decorative layers -->
  <div class="grid-bg" data-decor aria-hidden="true"></div>
  <div class="glow-orb green" data-decor aria-hidden="true" style="top:-180px; left:-160px; width:540px; height:540px; opacity:0.5;"></div>
  <div class="glow-orb blue" data-decor aria-hidden="true" style="bottom:-100px; right:-80px; width:360px; height:360px; opacity:0.3;"></div>

  <!-- top brand bar -->
  <div style="position:absolute; top:40px; left:72px; right:72px; display:flex; justify-content:space-between; align-items:center; z-index:2;">
    <div class="closing-brand">
      <div class="closing-dot"></div>
      <div class="closing-wordmark">Latent.pk</div>
    </div>
    <div class="closing-meta">Investor Deck · 2026</div>
  </div>

  <!-- vertical-center content block -->
  <div style="position:absolute; top:50%; left:72px; transform:translateY(-50%); max-width:980px; z-index:2;">
    <span class="accent-pill">
      <span class="material-icons sm" style="font-size:14px;">forum</span>
      In Conversation
    </span>
    <h1 style="font-family:var(--font-heading); font-weight:800; font-size:76px; color:var(--primary); line-height:1.0; letter-spacing:-0.03em; margin-top:24px; max-width:940px;">
      Let's turn <span class="accent">240 million people</span> into informed investors.
    </h1>
    <p style="font-family:var(--font-body); font-weight:400; font-size:19px; color:var(--muted); line-height:1.5; margin-top:28px; max-width:760px;">
      Latent.pk is the plan-first investment layer for the Pakistan Stock Exchange. We are raising $1.5M pre-seed to ship it.
    </p>

    <!-- contact strip -->
    <div style="margin-top:64px; display:flex; gap:32px; align-items:center;">
      <div class="closing-contact-dot"></div>
      <span style="font-family:var(--font-body); font-weight:600; font-size:16px; color:var(--primary);">founders@latent.pk</span>
      <span style="width:1px; height:16px; background:var(--border);"></span>
      <span style="font-family:var(--font-body); font-weight:600; font-size:16px; color:var(--accent);">latent.pk/investors</span>
    </div>
  </div>

  <!-- thin accent bar above page-mark -->
  <div class="closing-accent-bar"></div>

  <!-- page-mark -->
  <div class="page-mark">
    <span class="brand">LATENT.PK · THANK YOU</span>
    <span class="num">14 / 14</span>
  </div>
</div>
</body>
</html>
